<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技術科 学習ポータル</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #f0fdfa;
      --tool-accent: #334155;
      --purple: #7c3aed;
      --purple-dark: #6d28d9;
      --purple-light: #f5f3ff;
      --blue: #0284c7;
      --blue-light: #f0f9ff;
      --red: #dc2626;
      --red-light: #fef2f2;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --text-main: #1e293b;
      --text-sub: #475569;
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.65;
    }

    /* パスワードロック画面 */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }
    .lock-box {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 14px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .lock-box h2 { margin: 0 0 10px; font-size: 1.25rem; color: #0f172a; }
    .lock-box p { font-size: 0.9rem; color: var(--text-sub); margin: 0 0 20px; }
    .lock-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    .lock-input:focus { outline: none; border-color: var(--primary); }
    .lock-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .lock-btn:hover { background: var(--primary-dark); }
    .lock-error { color: #dc2626; font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

    /* HTMLアプリ実行モーダル */
    #app-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      display: none;
      flex-direction: column;
      z-index: 8000;
      padding: 12px;
    }
    .app-modal-window {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-width: 1200px;
      margin: 0 auto;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .app-modal-bar {
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .app-modal-title {
      font-weight: bold;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-modal-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-btn-newtab {
      background: #334155;
      color: #fff;
      text-decoration: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: bold;
      display: inline-block;
    }
    .modal-btn-newtab:hover { background: #475569; }
    .modal-btn-close {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-btn-close:hover { background: #b91c1c; }
    #app-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #0f172a 0%, var(--primary-dark) 100%);
      color: #ffffff;
      padding: 30px 20px 44px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; font-size: 1.7rem; letter-spacing: 0.03em; }
    header p { margin: 0; opacity: 0.9; font-size: 0.92rem; }

    main {
      max-width: 920px;
      margin: -24px auto 60px;
      padding: 0 16px;
    }

    /* 1. 一番上の連絡事項ボックス */
    .notice-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 22px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.07);
      border-left: 6px solid var(--primary);
    }
    .notice-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .notice-list { list-style: none; padding: 0; margin: 0; }
    .notice-item { padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    .notice-item:first-child { padding-top: 0; }
    .notice-item:last-child { border-bottom: none; padding-bottom: 0; }
    .notice-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .notice-date { font-size: 0.82rem; font-weight: bold; color: var(--text-sub); }
    .badge-important {
      background: #dc2626;
      color: #fff;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 1px 7px;
      border-radius: 4px;
    }
    .notice-title { font-weight: bold; font-size: 1rem; color: #0f172a; }
    .notice-body { margin: 4px 0 0; font-size: 0.92rem; color: var(--text-sub); white-space: pre-wrap; }

    /* 2. 学年・ツールタブ */
    .step-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-sub);
      margin: 0 0 6px 4px;
    }
    .grade-tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #cbd5e1;
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .grade-tab-btn {
      flex: 1;
      min-width: 100px;
      padding: 12px 14px;
      border: none;
      background: rgba(255,255,255,0.65);
      color: #334155;
      font-weight: bold;
      font-size: 1.05rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.15s;
    }
    .grade-tab-btn:hover { background: rgba(255,255,255,0.95); }
    .grade-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.35);
    }
    .grade-tab-btn.tool-tab {
      background: rgba(241, 245, 249, 0.85);
      border: 1px dashed #94a3b8;
    }
    .grade-tab-btn.tool-tab.active {
      background: var(--tool-accent);
      color: #ffffff;
      border: 1px solid var(--tool-accent);
      box-shadow: 0 2px 6px rgba(51, 65, 85, 0.35);
    }

    /* 分野フィルターチップ */
    .field-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .field-chip {
      padding: 6px 13px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: bold;
      cursor: pointer;
    }
    .field-chip:hover { background: #e2e8f0; }
    .field-chip.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }

    /* 3. 番号ゾーンカード */
    .zones-container { display: grid; gap: 16px; }
    .zone-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }
    .zone-card.open {
      border: 2px solid var(--primary);
      box-shadow: 0 4px 14px rgba(15, 118, 110, 0.1);
    }
    .zone-header {
      padding: 16px 20px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }
    .zone-header:hover { background: #f8fafc; }
    .zone-left { display: flex; align-items: center; gap: 14px; flex: 1; }
    .zone-num-badge {
      min-width: 46px;
      height: 46px;
      padding: 0 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .zone-title-area { flex: 1; }
    .zone-field-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: bold;
      padding: 1px 8px;
      border-radius: 4px;
      margin-bottom: 3px;
    }
    .theme-material { background: #fef3c7; color: #92400e; }
    .theme-energy   { background: #ffedd5; color: #9a3412; }
    .theme-bio      { background: #dcfce7; color: #166534; }
    .theme-info     { background: #e0f2fe; color: #075985; }
    .theme-common   { background: #e2e8f0; color: #334155; }

    .zone-title { font-size: 1.12rem; font-weight: bold; color: #0f172a; margin: 0; }
    .zone-count-info { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
    .zone-toggle-icon {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--primary);
      background: var(--primary-light);
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* ゾーンの中身 */
    .zone-body {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid #e2e8f0;
      background: #fafafa;
    }
    .zone-card.open .zone-body { display: block; }

    .zone-instruction {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.92rem;
      margin: 16px 0;
      white-space: pre-wrap;
    }

    .resource-list { display: grid; gap: 10px; margin-top: 14px; }
    .res-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 9px;
      text-decoration: none;
      color: inherit;
      transition: 0.15s;
      cursor: pointer;
    }
    .res-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }
    .res-card.app-card {
      border-left: 4px solid var(--purple);
      background: #fdfcff;
    }
    .res-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .kind-app    { background: var(--purple-light); color: var(--purple); border: 1px solid #ddd6fe; }
    .kind-web    { background: var(--blue-light); color: var(--blue); border: 1px solid #bae6fd; }
    .kind-video  { background: var(--red-light); color: var(--red); border: 1px solid #fecaca; }
    .kind-submit { background: var(--amber-light); color: var(--amber); border: 1px solid #fde68a; }
    .kind-pdf    { background: var(--primary-light); color: var(--primary-dark); border: 1px solid #99f6e4; }

    .res-btn {
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 6px;
      white-space: nowrap;
      border: none;
    }
    .btn-app    { background: var(--purple); }
    .btn-web    { background: var(--blue); }
    .btn-video  { background: var(--red); }
    .btn-submit { background: var(--amber); }
    .btn-pdf    { background: var(--primary); }

    .res-info { flex: 1; text-align: left; }
    .res-title { font-weight: bold; font-size: 1rem; color: #0f172a; }
    .res-desc { font-size: 0.84rem; color: var(--text-sub); margin-top: 2px; }

    /* サンプルコード */
    .code-card {
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      background: #ffffff;
    }
    .code-header {
      padding: 9px 14px;
      background: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-lang {
      background: #334155;
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 8px;
    }
    .copy-btn {
      background: #0f172a;
      color: #fff;
      border: none;
      padding: 5px 11px;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
    }
    pre {
      margin: 0;
      padding: 12px 14px;
      background: #1e293b;
      color: #f8fafc;
      overflow-x: auto;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.86rem;
    }

    .empty-msg { color: var(--text-sub); font-size: 0.9rem; margin: 12px 0 0; }
    footer { text-align: center; color: var(--text-sub); font-size: 0.8rem; padding-bottom: 30px; }

    @media (max-width: 600px) {
      .res-card { flex-direction: column; align-items: flex-start; }
      .res-btn { width: 100%; text-align: center; }
      .zone-header { padding: 14px; }
      #app-modal { padding: 0; }
      .app-modal-window { border-radius: 0; }
    }
  </style>
</head>
<body>

  <!-- パスワード認証画面 -->
  <div id="lock-screen" style="display:none;">
    <div class="lock-box">
      <h2>技術科ポータル 認証</h2>
      <p>授業で伝えられたパスワードを入力してください。</p>
      <input type="password" id="pw-input" class="lock-input" placeholder="パスワードを入力" autocomplete="off">
      <button id="pw-submit" class="lock-btn">入室する</button>
      <div id="pw-error" class="lock-error"></div>
    </div>
  </div>

  <!-- 自作HTMLアプリ実行モーダル -->
  <div id="app-modal">
    <div class="app-modal-window">
      <div class="app-modal-bar">
        <div class="app-modal-title" id="modal-app-title">学習アプリ</div>
        <div class="app-modal-actions">
          <a class="modal-btn-newtab" id="modal-newtab-link" href="#" target="_blank" rel="noopener noreferrer">別タブで開く ↗</a>
          <button class="modal-btn-close" id="modal-close-btn">✕ 閉じる</button>
        </div>
      </div>
      <iframe id="app-iframe" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="app-content" style="display:none;">
    <header>
      <h1 id="site-title">読み込み中...</h1>
      <p id="site-subtitle"></p>
    </header>

    <main>
      <!-- 1. 一番上の連絡事項 -->
      <div class="notice-card" id="notice-card">
        <div class="notice-header">📢 連絡事項</div>
        <ul class="notice-list" id="notice-list"></ul>
      </div>

      <!-- 2. 学年・ツール選択タブ -->
      <div class="step-label">▼ 1. 自分の学年を選んでください</div>
      <div class="grade-tab-bar" id="grade-tab-bar"></div>

      <!-- 分野絞り込み -->
      <div class="field-filter-bar" id="field-filter-bar" style="display:none;"></div>

      <!-- 3. 番号ゾーン一覧 -->
      <div class="step-label" id="zone-step-label">▼ 2. 先生から指示された「番号のゾーン」をタップして開いてください</div>
      <div class="zones-container" id="zones-container"></div>
    </main>

    <footer>
      <span id="footer-title"></span>
    </footer>
  </div>

  <script>
    let portalData = null;
    let selectedGradeIdx = 0;
    let selectedField = 'すべて';

    const appModal = document.getElementById('app-modal');
    const appIframe = document.getElementById('app-iframe');
    const modalTitle = document.getElementById('modal-app-title');
    const modalNewTabLink = document.getElementById('modal-newtab-link');

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      appModal.style.display = 'none';
      appIframe.src = 'about:blank';
    });

    function openHtmlAppFile(title, fileUrl) {
      modalTitle.textContent = title || '学習アプリ';
      modalNewTabLink.href = fileUrl;
      appIframe.src = fileUrl;
      appModal.style.display = 'flex';
    }

    fetch('data.json?v=' + new Date().getTime())
      .then(res => {
        if (!res.ok) throw new Error('データの読み込みに失敗しました');
        return res.json();
      })
      .then(data => {
        portalData = data;
        initAuth(data);
      })
      .catch(err => {
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('site-title').textContent = '読み込みエラー';
      });

    function initAuth(data) {
      const pw = (data.password || '').trim();
      const storageKey = 'tech_portal_auth_' + btoa(encodeURIComponent(data.site_title || 'site'));

      if (!pw || sessionStorage.getItem(storageKey) === pw) {
        unlockSite();
        return;
      }

      const lockScreen = document.getElementById('lock-screen');
      const pwInput = document.getElementById('pw-input');
      const pwSubmit = document.getElementById('pw-submit');
      const pwError = document.getElementById('pw-error');

      lockScreen.style.display = 'flex';

      const tryUnlock = () => {
        if (pwInput.value.trim() === pw) {
          sessionStorage.setItem(storageKey, pw);
          lockScreen.style.display = 'none';
          unlockSite();
        } else {
          pwError.textContent = 'パスワードが違います。もう一度確認してください。';
          pwInput.value = '';
          pwInput.focus();
        }
      };

      pwSubmit.addEventListener('click', tryUnlock);
      pwInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') tryUnlock();
      });
    }

    function unlockSite() {
      document.getElementById('app-content').style.display = 'block';
      renderAll();
    }

    function renderAll() {
      const data = portalData;
      document.title = data.site_title || '技術科 学習ポータル';
      document.getElementById('site-title').textContent = data.site_title || '';
      document.getElementById('site-subtitle').textContent = data.site_subtitle || '';
      document.getElementById('footer-title').textContent = data.site_title || '';

      // 1. 連絡事項
      const noticeCard = document.getElementById('notice-card');
      const noticeList = document.getElementById('notice-list');
      const notices = data.notices || [];
      if (notices.length === 0) {
        noticeCard.style.display = 'none';
      } else {
        notices.forEach(n => {
          const li = document.createElement('li');
          li.className = 'notice-item';
          const impBadge = n.important ? '<span class="badge-important">重要</span>' : '';
          const dateHtml = n.date ? `<span class="notice-date">${escapeHtml(n.date)}</span>` : '';
          const bodyHtml = n.body ? `<p class="notice-body">${escapeHtml(n.body)}</p>` : '';
          li.innerHTML = `
            <div class="notice-meta">${impBadge}${dateHtml}<span class="notice-title">${escapeHtml(n.title || '')}</span></div>
            ${bodyHtml}
          `;
          noticeList.appendChild(li);
        });
      }

      // 2. 学年・ツールタブ
      const grades = data.grades || [];
      const tabBar = document.getElementById('grade-tab-bar');
      grades.forEach((g, idx) => {
        const btn = document.createElement('button');
        const label = g.grade_name || `学年${idx + 1}`;
        const isToolTab = label.includes('ツール') || label.includes('その他');
        btn.className = 'grade-tab-btn' + (isToolTab ? ' tool-tab' : '') + (idx === selectedGradeIdx ? ' active' : '');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          selectedGradeIdx = idx;
          selectedField = 'すべて';
          document.querySelectorAll('.grade-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderGradeZones(grades[idx]);
        });
        tabBar.appendChild(btn);
      });

      if (grades.length > 0) {
        renderGradeZones(grades[0]);
      }
    }

    function getFieldThemeClass(fieldName) {
      if (!fieldName) return 'theme-common';
      if (fieldName.includes('材料')) return 'theme-material';
      if (fieldName.includes('エネルギー')) return 'theme-energy';
      if (fieldName.includes('生物')) return 'theme-bio';
      if (fieldName.includes('情報')) return 'theme-info';
      return 'theme-common';
    }

    function renderGradeZones(grade) {
      const zones = grade.zones || [];

      // 分野フィルターバー
      const fieldSet = new Set();
      zones.forEach(z => { if (z.field) fieldSet.add(z.field); });

      const filterBar = document.getElementById('field-filter-bar');
      filterBar.innerHTML = '';
      if (fieldSet.size <= 1) {
        filterBar.style.display = 'none';
      } else {
        filterBar.style.display = 'flex';
        ['すべて', ...Array.from(fieldSet)].forEach(fName => {
          const chip = document.createElement('button');
          chip.className = 'field-chip' + (selectedField === fName ? ' active' : '');
          chip.textContent = fName;
          chip.addEventListener('click', () => {
            selectedField = fName;
            renderGradeZones(grade);
          });
          filterBar.appendChild(chip);
        });
      }

      // 番号ゾーン描画
      const container = document.getElementById('zones-container');
      container.innerHTML = '';

      const filteredZones = selectedField === 'すべて'
        ? zones
        : zones.filter(z => z.field === selectedField);

      if (filteredZones.length === 0) {
        container.innerHTML = '<p class="empty-msg">現在ここに登録されている項目はありません。</p>';
        return;
      }

      filteredZones.forEach((zone, zIdx) => {
        const appItems = (zone.app_items || []).filter(x => x.html_file);
        const webItems = (zone.web_items || []).filter(x => x.url);
        const pdfItems = (zone.pdf_items || []).filter(x => x.file);
        const codeItems = (zone.code_items || []).filter(x => x.code);
        const totalCount = appItems.length + webItems.length + pdfItems.length + codeItems.length;

        const card = document.createElement('div');
        card.className = 'zone-card' + (zIdx === 0 ? ' open' : '');

        const fieldHtml = zone.field
          ? `<span class="zone-field-tag ${getFieldThemeClass(zone.field)}">${escapeHtml(zone.field)}</span>`
          : '';

        const header = document.createElement('div');
        header.className = 'zone-header';
        header.innerHTML = `
          <div class="zone-left">
            <div class="zone-num-badge">${escapeHtml(zone.zone_number || (zIdx + 1))}</div>
            <div class="zone-title-area">
              ${fieldHtml}
              <h3 class="zone-title">${escapeHtml(zone.zone_title || '授業ゾーン')}</h3>
              <div class="zone-count-info">教材・アプリ・資料：${totalCount}件</div>
            </div>
          </div>
          <div class="zone-toggle-icon">${zIdx === 0 ? '▲ 閉じる' : '▼ 開く'}</div>
        `;

        const body = document.createElement('div');
        body.className = 'zone-body';

        if (zone.instruction) {
          const inst = document.createElement('div');
          inst.className = 'zone-instruction';
          inst.textContent = zone.instruction;
          body.appendChild(inst);
        }

        const resList = document.createElement('div');
        resList.className = 'resource-list';

        // 0. 自作HTMLアプリ（アップロードされた.htmlファイル）
        appItems.forEach(item => {
          const div = document.createElement('div');
          div.className = 'res-card app-card';
          const badge = item.badge || '自作HTMLアプリ';
          const descHtml = item.description ? `<div class="res-desc">${escapeHtml(item.description)}</div>` : '';
          div.innerHTML = `
            <div class="res-info">
              <span class="res-badge kind-app">${escapeHtml(badge)}</span>
              <div class="res-title">${escapeHtml(item.title || '学習アプリ')}</div>
              ${descHtml}
            </div>
            <button type="button" class="res-btn btn-app">アプリを起動 ▶</button>
          `;
          div.addEventListener('click', () => {
            openHtmlAppFile(item.title || '学習アプリ', item.html_file);
          });
          resList.appendChild(div);
        });

        // 1. 外部リンク・動画・提出URL
        webItems.forEach(item => {
          const a = document.createElement('a');
          a.className = 'res-card';
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          let kindClass = 'kind-web';
          let btnClass = 'btn-web';
          let btnText = 'サイトを開く ↗';

          if (item.kind === '解説動画') {
            kindClass = 'kind-video';
            btnClass = 'btn-video';
            btnText = '動画を見る ▶';
          } else if (item.kind === '課題提出・アンケート') {
            kindClass = 'kind-submit';
            btnClass = 'btn-submit';
            btnText = '提出画面へ ↗';
          }

          const descHtml = item.description ? `<div class="res-desc">${escapeHtml(item.description)}</div>` : '';
          a.innerHTML = `
            <div class="res-info">
              <span class="res-badge ${kindClass}">${escapeHtml(item.kind || 'Webリンク')}</span>
              <div class="res-title">${escapeHtml(item.title || item.url)}</div>
              ${descHtml}
            </div>
            <div class="res-btn ${btnClass}">${btnText}</div>
          `;
          resList.appendChild(a);
        });

        // 2. 配布プリント・PDF
        pdfItems.forEach(item => {
          const a = document.createElement('a');
          a.className = 'res-card';
          a.href = item.file;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const label = item.badge || 'PDFプリント';
          const descHtml = item.description ? `<div class="res-desc">${escapeHtml(item.description)}</div>` : '';
          a.innerHTML = `
            <div class="res-info">
              <span class="res-badge kind-pdf">${escapeHtml(label)}</span>
              <div class="res-title">${escapeHtml(item.title || item.file)}</div>
              ${descHtml}
            </div>
            <div class="res-btn btn-pdf">プリントを開く</div>
          `;
          resList.appendChild(a);
        });

        // 3. サンプルコード
        codeItems.forEach(item => {
          const codeBox = document.createElement('div');
          codeBox.className = 'code-card';
          const langHtml = item.language ? `<span class="code-lang">${escapeHtml(item.language)}</span>` : '';
          codeBox.innerHTML = `
            <div class="code-header">
              <div>${langHtml}<strong>${escapeHtml(item.title || 'サンプルコード')}</strong></div>
              <button class="copy-btn">コピー</button>
            </div>
            <pre><code>${escapeHtml(item.code)}</code></pre>
          `;
          const copyBtn = codeBox.querySelector('.copy-btn');
          copyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(item.code).then(() => {
              copyBtn.textContent = 'コピー完了！';
              setTimeout(() => { copyBtn.textContent = 'コピー'; }, 2000);
            });
          });
          resList.appendChild(codeBox);
        });

        if (totalCount === 0) {
          resList.innerHTML = '<p class="empty-msg">このゾーンにはまだ教材が登録されていません。</p>';
        }

        body.appendChild(resList);

        header.addEventListener('click', () => {
          const isOpen = card.classList.toggle('open');
          header.querySelector('.zone-toggle-icon').textContent = isOpen ? '▲ 閉じる' : '▼ 開く';
        });

        card.appendChild(header);
        card.appendChild(body);
        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
